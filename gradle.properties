# Project-wide Gradle settings.

# JVM memory: the GitHub runner has ~16 GB RAM but only ~1 GB of swap, and the
# Gradle daemon is known to OOM there. Keep the heap modest.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# Build performance.
org.gradle.caching=true
org.gradle.parallel=true

# AndroidX is not used (no AndroidX dependency at all), but AGP 9 defaults this
# to true for `android.useAndroidX`-era projects; leaving it unset is fine.
# We deliberately do NOT enable the configuration cache: no need, and it makes
# CI failures harder to read.

kotlin.code.style=official

# Version. Bump APP_VERSION_NAME manually when we ship a new APK; the report
# header prints it, so an installed build can be identified from a paste.
# NOTE: these project properties OVERRIDE the `?:` fallbacks in
# app/build.gradle.kts — edit here, not there.
APP_VERSION_NAME=0.3.0
APP_VERSION_CODE=3
