name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    # Pin the runner: `ubuntu-latest` moves to Ubuntu 26.04 in Nov 2026.
    # ubuntu-24.04 ships the Android SDK preinstalled (ANDROID_HOME is set).
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Make gradlew executable
        # Belt and braces: the executable bit is stored in the git index
        # (mode 100755), but a stray re-clone or an archive download can lose it.
        run: chmod +x ./gradlew

      - name: Show environment
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ./gradlew --version

      - name: Restore signing key
        # Keep one stable signature across CI runs. Without this, AGP generates a
        # fresh debug keystore on every runner, so each APK carries a different
        # certificate and Android refuses to install it over the previous one
        # ("App not installed") — forcing an uninstall, which wipes the relay
        # config. The secret is optional: with no secret set, the build falls
        # back to the default debug key and still succeeds.
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEY_BASE64" ]; then
            echo "no SIGNING_KEY_BASE64 secret; falling back to the default debug key"
            exit 0
          fi
          mkdir -p keystore
          printf '%s' "$SIGNING_KEY_BASE64" | base64 -d > keystore/phone-agent.p12
          cat > keystore.properties <<'EOF'
          storeFile=keystore/phone-agent.p12
          storePassword=phoneagent
          keyAlias=phoneagent
          keyPassword=phoneagent
          EOF

      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: phone-agent-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          # Variant-specific dir (testDebugUnitTest / testReleaseUnitTest).
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
